<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudTask</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-shell">

        <aside class="sidebar">
            <div>
                <div class="brand">
                    <div class="brand-icon">☁️</div>
                    <div>
                        <h2>CloudTask</h2>
                        <p>Task Manager</p>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    <button class="nav-item active" data-filter="all">
                        <span class="nav-icon">⌂</span>
                        My Tasks
                    </button>

                    <button class="nav-item" data-filter="active">
                        <span class="nav-icon">⌛</span>
                        Active
                    </button>

                    <button class="nav-item" data-filter="completed">
                        <span class="nav-icon">✓</span>
                        Completed
                    </button>
                </nav>
            </div>

            <button id="logoutButton" class="logout-button">
                Sign out
            </button>
        </aside>

        <main class="main-content">

            <header class="page-header">
                <div>
                    <p class="eyebrow">MY WORKSPACE</p>
                    <h1>My Tasks</h1>
                    <p class="subtitle">
                        Stay focused and keep track of what matters.
                    </p>
                </div>

                <div class="stats">
                    <div class="stat">
                        <strong id="totalCount">0</strong>
                        <span>Total</span>
                    </div>

                    <div class="stat">
                        <strong id="activeCount">0</strong>
                        <span>Active</span>
                    </div>

                    <div class="stat">
                        <strong id="completedCount">0</strong>
                        <span>Completed</span>
                    </div>
                </div>
            </header>

            <section class="add-task-card">
                <div class="add-icon">+</div>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                >

                <button id="addTaskButton">
                    Add Task
                </button>
            </section>

            <section class="tasks-section">
                <div class="section-header">
                    <h3>Your tasks</h3>
                    <span id="taskCount"></span>
                </div>

                <ul id="taskList" class="task-list"></ul>
            </section>

        </main>

    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
