name: Backend Deploy DEV

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::833090513321:role/cloudtask-backend-deploy-dev
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: backend
        run: python -m py_compile lambda_function.py

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Package Lambda
        working-directory: backend
        run: |
          rm -rf package
          mkdir package
          pip install -r requirements.txt -t package
          cp lambda_function.py package/
          cd package
          zip -r ../lambda_function.zip .

      - name: Deploy DEV Lambda
        working-directory: backend
        run: |
          aws lambda update-function-code \
            --function-name cloudtask-api-dev \
            --zip-file fileb://lambda_function.zip