name: Frontend Deploy DEV

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::833090513321:role/cloudtask-frontend-deploy-dev
          aws-region: us-east-1

      - name: Generate DEV frontend config
        run: |
          cat > frontend/config.js <<'CONFIG'
          window.APP_CONFIG = {
              COGNITO_DOMAIN: "https://cloudtask-dev-ethem.auth.us-east-1.amazoncognito.com",
              CLIENT_ID: "247j784qbmmtjjl077brfoo90g",
              REDIRECT_URI: "https://d3h1ul4o6ubygv.cloudfront.net",
              API_URL: "https://2twbkx3b5l.execute-api.us-east-1.amazonaws.com/tasks"
          };
          CONFIG

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/config.js
          node --check frontend/app.js

      - name: Deploy frontend to DEV S3
        run: |
          aws s3 sync frontend/ \
            s3://cloudtask-frontend-ethem-dev/frontend/ \
            --delete

      - name: Invalidate DEV CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EHR9D841GE1AB \
            --paths "/*"