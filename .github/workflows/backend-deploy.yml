name: Backend Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::833090513321:role/cloudtask-backend-deploy
          aws-region: us-east-1
      
      - name: Check Python syntax
        run: |
          python3 -m py_compile backend/lambda_function.py
    
      - name: Install backend dependencies
        run: |
          python3 -m pip install -r backend/requirements.txt

      - name: Run backend unit tests
        run: |
          python3 -m unittest backend/tests/test_lambda.py

      - name: Package Lambda
        run: |
          cd backend
          zip lambda_function.zip lambda_function.py

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name cloudtask-api \
            --zip-file fileb://backend/lambda_function.zip